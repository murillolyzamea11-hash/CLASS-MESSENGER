
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Chat App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login and sign-up screen -->
  <main id="auth-screen" class="chat auth">
    <h1>Class Chat</h1>
    <p class="subtitle">Log in to join the conversation.</p>

    <form id="auth-form">
      <label for="display-name">Display name (sign up only)</label>
      <input
        id="display-name"
        type="text"
        maxlength="24"
        minlength="2"
        placeholder="Your name or nickname"
      >

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        required
        placeholder="you@school.com"
      >

      <label for="password">Password (at least 8 characters)</label>
      <input
        id="password"
        type="password"
        minlength="8"
        required
        placeholder="Enter password"
      >

      <div class="auth-buttons">
        <button type="submit" id="login-btn">Log in</button>
        <button type="button" id="signup-btn" class="ghost">Sign up</button>
      </div>
    </form>

    <p id="auth-message" class="auth-message" role="status"></p>
  </main>

  <!-- Chat screen -->
  <main id="chat-screen" class="chat" hidden>
    <header class="chat-header">
      <div>
        <h1>Class Chat</h1>
        <p class="subtitle">Classroom conversation</p>
      </div>

      <div class="controls">
        <span id="who">Signed in</span>
        <button id="logout-btn" type="button" class="ghost">Log out</button>
      </div>
    </header>

    <div id="connection-status" class="connection-status">
      Connecting to chat...
    </div>

    <ul id="messages" class="messages" aria-live="polite"></ul>

    <form id="message-form" class="composer" autocomplete="off">
      <label for="message-input" class="visually-hidden">Message</label>
      <input
        id="message-input"
        type="text"
        maxlength="500"
        required
        placeholder="Type a message or /weather Manila"
      >
      <button type="submit" id="send-btn">Send</button>
    </form>
  </main>

  <!-- Supabase JavaScript library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
